<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillHub — Paper · 暖纸编辑</title>
<style>
  :root{
    --bg:#f7f3eb; --panel:#fffdf7; --panel-2:#f1ece0;
    --border:#e6decd; --border-2:#ece4d3;
    --ink:#2b2620; --ink-2:#57504a; --ink-3:#8a8075; --ink-4:#b5aa9c;
    --brand:#d9543e; --brand-ink:#c44835; --brand-wash:#f9ded6;
    --ok:#4a9d6e; --warn:#d4914e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC",sans-serif; font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased}
  .app{display:flex; height:100vh}

  .side{width:216px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column}
  .brand{display:flex; align-items:center; gap:10px; padding:20px 18px 14px}
  .mark{width:40px; height:40px; flex-shrink:0; object-fit:contain; background:none; display:block}
  .brand b{font-size:15px; letter-spacing:-.01em}
  .brand span{display:block; color:var(--ink-3); font-size:10.5px; letter-spacing:.05em}
  nav{flex:1; padding:6px 12px; display:flex; flex-direction:column; gap:2px}
  .nav-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:9px; color:var(--ink-2); font-weight:500; font-size:14px; cursor:pointer; position:relative}
  .nav-item:hover{background:var(--panel-2); color:var(--ink)}
  .nav-item.on{background:var(--brand-wash); color:var(--brand-ink)}
  .nav-item.on::before{content:""; position:absolute; left:-12px; top:22%; height:56%; width:3px; border-radius:99px; background:var(--brand)}
  .side-foot{border-top:1px solid var(--border); padding:12px 18px; color:var(--ink-3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; line-height:1.7}

  .main{flex:1; min-width:0; overflow-y:auto}
  .wrap{max-width:980px; padding:28px 32px 120px; margin:0 auto}
  .head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px}
  .head h1{font-size:21px; font-weight:700; letter-spacing:-.02em}
  .head p{color:var(--ink-3); font-size:12.5px; margin-top:3px}

  .toolbar{display:flex; align-items:center; gap:8px; margin-bottom:16px}
  .search{flex:1; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 11px; color:var(--ink-3)}
  .search input{border:none; outline:none; background:none; flex:1; font-size:13px; color:var(--ink)}
  .search input::placeholder{color:var(--ink-4)}
  .chip{padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:var(--panel); color:var(--ink-2); font-size:12px; cursor:pointer}
  .chip:hover{background:var(--panel-2)}
  .chip.on{background:var(--ink); color:#fdf9f0; border-color:var(--ink)}

  .agents{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap}
  .agent{display:flex; align-items:center; gap:7px; padding:5px 10px; border-radius:99px; border:1px solid var(--border); background:var(--panel); font-size:12px; color:var(--ink-2)}
  .agent .dot{width:8px; height:8px; border-radius:99px}
  .agent .dot.on{background:var(--ok)}
  .agent .dot.off{background:var(--ink-4)}
  .agent .dot.warn{background:var(--warn)}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; cursor:pointer; box-shadow:0 1px 3px rgba(125,105,60,.05); transition:transform .12s, box-shadow .12s, border-color .12s}
  .card:hover{transform:translateY(-1px); box-shadow:0 6px 18px -6px rgba(125,105,60,.16); border-color:#d8cdb4}
  .card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
  .card h3{font-size:13.5px; font-weight:600; letter-spacing:-.01em}
  .card .tag{font-size:10px; color:var(--ink-4); white-space:nowrap}
  .card p{color:var(--ink-3); font-size:11.5px; margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card .row{margin-top:12px; display:flex; align-items:center; justify-content:space-between}
  .status{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-3)}
  .status .dot{width:6px; height:6px; border-radius:99px}
  .s-on .dot{background:var(--ok)} .s-on{color:var(--ok)}
  .s-no .dot{background:var(--ink-4)} .s-no{color:var(--ink-4)}
  .s-rm .dot{background:var(--warn)} .s-rm{color:var(--warn)}
  .btn{border:none; cursor:pointer; border-radius:10px; font-size:12px; font-weight:600; padding:6px 12px; background:var(--panel-2); color:var(--ink-2)}
  .btn:hover{background:#e5ddca; color:var(--ink)}
  .btn.primary{background:var(--brand); color:#fff}
  .btn.primary:hover{background:var(--brand-ink)}
  .btn.ghost{background:none; color:var(--ink-3)}
  .btn.ghost:hover{background:var(--panel-2); color:var(--ink)}

  .hint{margin-top:16px; color:var(--ink-4); font-size:11.5px; text-align:center}

  .dock{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(255,252,246,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--border-2); border-radius:16px; box-shadow:0 10px 30px -10px rgba(125,105,60,.28); padding:10px 12px; display:flex; align-items:center; gap:14px; max-width:720px; width:calc(100% - 360px)}
  .dock .sel{font-size:12.5px; color:var(--ink-2)}
  .dock .sel b{color:var(--brand-ink)}
  .dock .sp{flex:1}
  .dock .btn{padding:8px 16px}
</style>
</head>
