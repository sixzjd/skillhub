name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos-latest'
        run: pnpm tauri build

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        run: pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          # 固定文件名副本：官网 "releases/latest/download/..." 直链用，跨版本不变
          for f in release-assets/*.dmg; do cp "$f" release-assets/SkillHub-macOS.dmg; done
          for f in release-assets/*.msi; do cp "$f" release-assets/SkillHub-Windows.msi; done
          for f in release-assets/*x64-setup.exe; do cp "$f" release-assets/SkillHub-Windows-setup.exe; done
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SkillHub ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## SkillHub ${{ github.event.inputs.version || github.ref_name }}

            ### Downloads
            - **macOS**: `.dmg` installer
            - **Windows**: `.msi` installer

            ### What's New
            - Red + beige warm theme UI
            - Trash/recycle bin for deleted skills
            - Selective skill sync (choose which skills to sync)
            - Improved sidebar with app icon
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
